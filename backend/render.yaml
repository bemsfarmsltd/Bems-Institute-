services:
  - type: web
    name: bems-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Transactional email (payment receipts, admin alerts, registration
      # confirmations) via Resend. Without these, emails are only logged.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Optional: extra comma-separated addresses that get "new payment"
      # alerts on top of every ADMIN account's email.
      - key: ADMIN_NOTIFY_EMAILS
        sync: false
      - key: NODE_ENV
        value: production
