name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bems_app
          POSTGRES_PASSWORD: bems_app_ci_pw
          POSTGRES_DB: bems_lms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Same rootDir/buildCommand Render actually uses in production
      # (backend/render.yaml) — migrate deploy reads backend/prisma/migrations,
      # which is the one folder kept authoritative all session.
      DATABASE_URL: postgresql://bems_app:bems_app_ci_pw@localhost:5432/bems_lms_ci
      SESSION_SECRET: ci-test-secret-not-for-production-use-only
      ADMIN_ACCESS_CODE: ci-admin-code
      FRONTEND_URL: http://localhost:3000
      PORT: 4000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root (frontend) dependencies
        run: npm install

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Apply database migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Seed course content (tests rely on real seeded courses/assignments)
        run: npm run db:seed

      - name: Typecheck backend
        working-directory: backend
        run: npx tsc --noEmit

      - name: Lint backend
        working-directory: backend
        run: npx eslint src

      - name: Run backend tests
        working-directory: backend
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    env:
      # Only used for `prisma generate` during install — no live DB needed
      # to typecheck/lint the frontend.
      DATABASE_URL: postgresql://user:password@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Lint frontend
        # Advisory, not blocking: a repo-wide lint run surfaced ~28
        # pre-existing react-hooks/set-state-in-effect errors scattered
        # across many files, predating this CI pipeline. Reports here
        # rather than silently hiding them, but doesn't fail the build on
        # day one over debt this pipeline didn't create — see the backlog
        # note in the PR/commit that introduced CI.
        run: npm run lint
        continue-on-error: true
